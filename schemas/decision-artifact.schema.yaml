$schema: "https://json-schema.org/draft/2020-12/schema"
title: DecisionArtifact
type: object
required:
  - decision_id
  - debate_id
  - event_id
  - repository
  - event_type
  - resolution
  - summary
  - recommendations
  - timestamp
properties:
  decision_id:
    type: string
    pattern: "^dec_[A-Za-z0-9._-]+$"

  debate_id:
    type: string
    pattern: "^debate_[A-Za-z0-9._-]+$"

  event_id:
    type: string
    pattern: "^evt_[A-Za-z0-9._-]+$"

  repository:
    type: string
    minLength: 1

  event_type:
    type: string

  resolution:
    type: string
    enum:
      - consensus
      - qualified_consensus
      - escalation
      - observation_only

  severity:
    type: string
    enum:
      - low
      - medium
      - high
      - critical

  summary:
    type: string
    minLength: 1

  role_outputs:
    type: array
    items:
      type: object
      required:
        - role
        - stance
        - observations
        - recommendations
        - confidence
      properties:
        role:
          type: string

        stance:
          type: string
          enum:
            - support
            - support_with_revision
            - caution
            - object
            - abstain

        observations:
          type: array
          items:
            type: string

        risks:
          type: array
          items:
            type: string

        recommendations:
          type: array
          items:
            type: string

        confidence:
          type: number
          minimum: 0
          maximum: 1

        priority:
          type: string
          enum:
            - low
            - medium
            - high

      additionalProperties: false

  recommendations:
    type: array
    items:
      type: string

  writeback:
    type: object
    properties:
      mode:
        type: string
        enum:
          - none
          - comment
          - issue
          - label
          - draft_pr
          - escalate

      target:
        type: string

      labels:
        type: array
        items:
          type: string

    additionalProperties: false

  memory_updates:
    type: array
    items:
      type: string

  traceability:
    type: object
    properties:
      schema_version:
        type: string
      related_thread_ids:
        type: array
        items:
          type: string
      related_repo_ids:
        type: array
        items:
          type: string
    additionalProperties: false

  timestamp:
    type: string
    format: date-time

additionalProperties: false