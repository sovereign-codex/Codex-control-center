name: Control Center Router

on:
  push:
    paths:
      - 'incoming/*.json'

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Control Center
        uses: actions/checkout@v4

      - name: Ensure directories
        run: |
          mkdir -p queue/events
          mkdir -p queue/decisions
          mkdir -p logs/router

      - name: Process incoming handoffs
        run: |
          echo "=== ROUTER START ==="

          shopt -s nullglob

          for file in incoming/*.json; do
            [ -f "$file" ] || continue

            echo "Processing $file"

            ROUTE=$(jq -r '.routing.route // "unknown"' "$file")
            TYPE=$(jq -r '.payload.type // "unknown"' "$file")
            TITLE=$(jq -r '.payload.title // "Untitled"' "$file")
            TRACE=$(jq -r '.trace_id // "no-trace"' "$file")

            BASENAME=$(basename "$file")

            EVENT_FILE="queue/events/${BASENAME}"
            DECISION_FILE="queue/decisions/${BASENAME}"

            echo "Route detected: $ROUTE"
            echo "Trace: $TRACE"

            # Copy raw event
            cp "$file" "$EVENT_FILE"
            echo "Copied to queue/events"

            # Create decision file (FIXED STRUCTURE)
            jq -n \
              --arg trace "$TRACE" \
              --arg route "$ROUTE" \
              --arg type "$TYPE" \
              --arg title "$TITLE" \
              '{
                trace_id: $trace,
                routing: {
                  route: $route
                },
                payload: {
                  type: $type,
                  title: $title
                },
                status: "queued"
              }' > "$DECISION_FILE"

            echo "Created decision file: $DECISION_FILE"

            # Move processed file to logs
            mv "$file" "logs/router/${BASENAME}"
            echo "Archived original to logs/router"

          done

          echo "=== ROUTER END ==="

      - name: Commit routing results
        run: |
          git config user.name "codex-router"
          git config user.email "actions@github.com"

          git add queue/ logs/
          git commit -m "Router processed incoming signals" || echo "No changes"

          git push