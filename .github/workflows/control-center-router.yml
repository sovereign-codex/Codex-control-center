name: Control Center Router

on:
  repository_dispatch:
    types: [trace-event]

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # 1. LOAD EVENT
      # -----------------------------
      - name: Load payload
        id: payload
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > event.json

          TRACE_ID=$(jq -r '.trace_id // empty' event.json)
          WORKFLOW=$(jq -r '.workflow // empty' event.json)
          REPO=$(jq -r '.repo // empty' event.json)
          STATUS=$(jq -r '.status // "unknown"' event.json)
          TIMESTAMP=$(jq -r '.timestamp // empty' event.json)

          echo "trace_id=$TRACE_ID" >> $GITHUB_OUTPUT
          echo "workflow=$WORKFLOW" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      # -----------------------------
      # 2. VALIDATION (HARD GATE)
      # -----------------------------
      - name: Validate event
        run: |
          if [ -z "${{ steps.payload.outputs.trace_id }}" ] || \
             [ -z "${{ steps.payload.outputs.workflow }}" ] || \
             [ -z "${{ steps.payload.outputs.repo }}" ]; then
            echo "❌ Invalid event payload"
            exit 1
          fi

      # -----------------------------
      # 3. ROUTE DECISION ENGINE
      # -----------------------------
      - name: Determine route
        id: route
        run: |
          WORKFLOW="${{ steps.payload.outputs.workflow }}"
          STATUS="${{ steps.payload.outputs.status }}"

          TARGET="none"

          if [[ "$WORKFLOW" == *"control-center"* ]]; then
            TARGET="control-center-result-receiver"

          elif [[ "$WORKFLOW" == *"avot-engine"* ]]; then
            TARGET="avot-engine-receiver"

          elif [[ "$WORKFLOW" == *"dispatch"* ]]; then
            TARGET="cross-repo-dispatcher"

          elif [[ "$STATUS" == *"fail"* ]] || [[ "$STATUS" == *"error"* ]]; then
            TARGET="control-center-recovery"

          else
            TARGET="control-center-result-receiver"
          fi

          echo "target=$TARGET" >> $GITHUB_OUTPUT

      # -----------------------------
      # 4. EMIT DECISION ARTIFACT
      # -----------------------------
      - name: Save decision
        run: |
          mkdir -p decisions

          jq -n \
            --arg trace_id "${{ steps.payload.outputs.trace_id }}" \
            --arg from "${{ steps.payload.outputs.workflow }}" \
            --arg to "${{ steps.route.outputs.target }}" \
            --arg timestamp "${{ steps.payload.outputs.timestamp }}" \
            '{
              trace_id: $trace_id,
              from: $from,
              to: $to,
              decision: "route",
              timestamp: $timestamp
            }' > decisions/${{ steps.payload.outputs.trace_id }}.json

      # -----------------------------
      # 5. DISPATCH TO TARGET
      # -----------------------------
      - name: Forward event
        run: |
          TARGET="${{ steps.route.outputs.target }}"

          echo "➡️ Routing to $TARGET"

          curl -X POST https://api.github.com/repos/sovereign-codex/Codex-control-center/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d "{
              \"event_type\": \"$TARGET\",
              \"client_payload\": $(cat event.json)
            }"

      # -----------------------------
      # 6. COMMIT DECISION TRACE
      # -----------------------------
      - name: Commit decision log
        run: |
          git config user.name "codex-bot"
          git config user.email "actions@github.com"

          git add decisions
          git commit -m "Routing decision for ${{ steps.payload.outputs.trace_id }}" || echo "No changes"
          git push