name: Control Center Router

on:
  push:
    paths:
      - 'incoming/*.json'

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Control Center
        uses: actions/checkout@v4

      - name: Ensure directories
        run: |
          mkdir -p queue/events
          mkdir -p queue/decisions
          mkdir -p logs/router

      - name: Process incoming handoffs
        run: |
          shopt -s nullglob

          for file in incoming/*.json; do
            [ -f "$file" ] || continue

            echo "Processing $file"

            ROUTE=$(jq -r '.routing.route' "$file")
            TYPE=$(jq -r '.payload.type' "$file")
            TITLE=$(jq -r '.payload.title' "$file")
            TRACE=$(jq -r '.trace_id' "$file")

            BASENAME=$(basename "$file")

            EVENT_FILE="queue/events/${BASENAME}"

            cp "$file" "$EVENT_FILE"

            echo "Routed to queue/events"

            # Create decision record
            DECISION_FILE="queue/decisions/${BASENAME}"

            jq -n \
              --arg trace "$TRACE" \
              --arg route "$ROUTE" \
              --arg type "$TYPE" \
              --arg title "$TITLE" \
              '{
                trace_id: $trace,
                decision: {
                  route: $route,
                  type: $type,
                  title: $title
                },
                status: "queued"
              }' > "$DECISION_FILE"

            # Move processed file
            mv "$file" "logs/router/${BASENAME}"

          done

      - name: Commit routing results
        run: |
          git config user.name "codex-router"
          git config user.email "actions@github.com"

          git add queue/ logs/
          git commit -m "Router processed incoming signals" || echo "No changes"

          git push