name: Control Center Router

on:
  repository_dispatch:
    types: [trace-event, routed-event]

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # 1. VALIDATION GATE
      # -------------------------
      - name: Validate + Normalize Event
        id: validate
        run: node scripts/validate_trace_event.js
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}

      - name: Reject Invalid Event
        if: steps.validate.outputs.valid != 'true'
        run: |
          echo "Event rejected at validation layer"
          echo '${{ steps.validate.outputs.event }}'
          exit 1

      # -------------------------
      # 2. PARSE NORMALIZED EVENT
      # -------------------------
      - name: Parse Event
        id: parse
        run: |
          echo '${{ steps.validate.outputs.event }}' > event.json

          TRACE_ID=$(jq -r '.trace_id' event.json)
          STATUS=$(jq -r '.status' event.json)
          WORKFLOW=$(jq -r '.workflow' event.json)

          echo "trace_id=$TRACE_ID" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "workflow=$WORKFLOW" >> $GITHUB_OUTPUT

      # -------------------------
      # 3. ROUTING LOGIC
      # -------------------------
      - name: Determine Route
        id: route
        run: |
          STATUS="${{ steps.parse.outputs.status }}"

          TARGET=""

          if [[ "$STATUS" == "decision_created" ]]; then
            TARGET="sovereign-codex/Codex-control-center"

          elif [[ "$STATUS" == "route_selected" ]]; then
            TARGET="sovereign-codex/Cross-repo-dispatcher"

          elif [[ "$STATUS" == "dispatched" ]]; then
            TARGET="sovereign-codex/AVOT-engine"

          elif [[ "$STATUS" == "result_sent" ]]; then
            TARGET="sovereign-codex/Control-center-result-receiver"

          elif [[ "$STATUS" == "failed" ]]; then
            TARGET="sovereign-codex/AVOT-TRACE"

          else
            TARGET="sovereign-codex/AVOT-TRACE"
          fi

          echo "target=$TARGET" >> $GITHUB_OUTPUT

          echo "Routing decision:"
          echo "$STATUS → $TARGET"

      # -------------------------
      # 4. TRACE ENRICHMENT
      # -------------------------
      - name: Enrich Event with Route
        id: enrich
        run: |
          EVENT='${{ steps.validate.outputs.event }}'

          echo "$EVENT" | jq --arg target "${{ steps.route.outputs.target }}" '
            .target = $target
          ' > enriched.json

          echo "event=$(cat enriched.json)" >> $GITHUB_OUTPUT

      # -------------------------
      # 5. DISPATCH
      # -------------------------
      - name: Dispatch to Target Repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ steps.route.outputs.target }}
          event-type: routed-event
          client-payload: ${{ steps.enrich.outputs.event }}

      # -------------------------
      # 6. STORE TRACE (ALWAYS)
      # -------------------------
      - name: Store Trace Event
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: sovereign-codex/AVOT-TRACE
          event-type: trace-event
          client-payload: ${{ steps.enrich.outputs.event }}