name: Control Center Router

on:
  repository_dispatch:
    types:
      - route-event

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prepare and validate handoff policy
        id: prepare
        run: node scripts/handoff/run.mjs prepare router

      - name: Create scoped dispatch token
        if: steps.prepare.outputs.ready == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          owner: sovereign-codex
          repositories: |
            Codex-control-center
          permission-contents: write

      - name: Revalidate, claim, and dispatch once
        if: steps.prepare.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HANDOFF_DISPATCH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/handoff/run.mjs execute router

      - name: Preserve handoff observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: control-center-router-${{ github.run_id }}-${{ github.run_attempt }}
          path: .handoff-state/router/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
