name: Control Center Router

on:
  repository_dispatch:
    types:
      - engine_signal
  push:
    paths:
      - 'incoming/*.json'

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Control Center
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          owner: sovereign-codex
          repositories: |
            AVOT-TRACE
            Codex-control-center

      - name: Ensure directories
        run: |
          mkdir -p queue/events
          mkdir -p queue/decisions
          mkdir -p logs/router

      # 🔥 CORE ROUTING LOGIC (single source of truth)
      - name: Route signal
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "=== ROUTER START ==="

          process_signal () {
            TRACE="$1"
            TYPE="$2"
            PRIORITY="$3"
            SOURCE_REPO="$4"
            SOURCE_FILE="$5"
            BASENAME="$6"

            if [ -z "$TRACE" ]; then
              TRACE="trc_${BASENAME%.*}"
            fi

            if [ -z "$TYPE" ]; then
              TYPE="unknown"
            fi

            if [ -z "$PRIORITY" ]; then
              PRIORITY="low"
            fi

            ROUTE="control-center"

            if [ "$TYPE" = "signal" ]; then
              ROUTE="avot-engine"
            elif [ "$TYPE" = "archival" ]; then
              ROUTE="avot-archivist"
            fi

            echo "Trace: $TRACE"
            echo "Type: $TYPE"
            echo "Priority: $PRIORITY"
            echo "Route: $ROUTE"

            SAFE_NAME=$(echo "$TRACE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')

            EVENT_FILE="queue/events/${SAFE_NAME}.json"
            DECISION_FILE="queue/decisions/${SAFE_NAME}.json"

            # Store event
            jq -n \
              --arg trace_id "$TRACE" \
              --arg type "$TYPE" \
              --arg priority "$PRIORITY" \
              --arg source_repo "$SOURCE_REPO" \
              --arg source_file "$SOURCE_FILE" \
              '{
                trace_id: $trace_id,
                type: $type,
                priority: $priority,
                source: {
                  repo: $source_repo,
                  file: $source_file
                }
              }' > "$EVENT_FILE"

            # Create decision
            jq -n \
              --arg trace_id "$TRACE" \
              --arg route "$ROUTE" \
              --arg type "$TYPE" \
              --arg priority "$PRIORITY" \
              '{
                trace_id: $trace_id,
                decision: {
                  route: $route
                },
                payload: {
                  type: $type,
                  priority: $priority
                },
                status: "queued"
              }' > "$DECISION_FILE"

            # 🔥 TRACE
            curl -s -X POST https://api.github.com/repos/sovereign-codex/AVOT-TRACE/dispatches \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "{
                \"event_type\": \"trace_log\",
                \"client_payload\": {
                  \"trace_id\": \"$TRACE\",
                  \"repo\": \"${GITHUB_REPOSITORY}\",
                  \"workflow\": \"control-center-router\",
                  \"status\": \"decision_created:$ROUTE\"
                }
              }"
          }

          # 🔁 Handle repository dispatch (new system)
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            process_signal \
              "${{ github.event.client_payload.trace_id }}" \
              "${{ github.event.client_payload.type }}" \
              "${{ github.event.client_payload.priority }}" \
              "${{ github.event.client_payload.source_repo }}" \
              "${{ github.event.client_payload.file }}" \
              "${{ github.run_id }}"
          fi

          # 🔁 Handle legacy incoming files
          shopt -s nullglob
          for file in incoming/*.json; do
            [ -f "$file" ] || continue

            BASENAME=$(basename "$file")

            process_signal \
              "$(jq -r '.trace_id // empty' "$file")" \
              "$(jq -r '.type // .payload.type // "unknown"' "$file")" \
              "$(jq -r '.priority // .payload.priority // "low"' "$file")" \
              "$(jq -r '.source.repo // "unknown"' "$file")" \
              "$(jq -r '.source.file // "'"$BASENAME"'"' "$file")" \
              "$BASENAME"

            mv "$file" "logs/router/${BASENAME}"
          done

          echo "=== ROUTER END ==="

      - name: Commit routing results
        run: |
          git config user.name "codex-router"
          git config user.email "actions@github.com"

          git pull origin main --rebase || echo "No remote changes"

          git add queue/ logs/
          git commit -m "Router created decisions" || echo "No changes"

          git pull origin main --rebase || echo "No remote changes"

          git push

      - name: Trigger Dispatcher
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl -s -X POST \
            https://api.github.com/repos/sovereign-codex/Codex-control-center/dispatches \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"event_type":"engine_handoff"}'