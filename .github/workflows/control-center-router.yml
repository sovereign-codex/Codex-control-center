name: Control Center Router

on:
  repository_dispatch:
    types:
      - route-event

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 0. CHECKOUT
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # 1. GENERATE GITHUB APP TOKEN
      # -----------------------------
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          owner: sovereign-codex

      # -----------------------------
      # 2. LOAD EVENT
      # -----------------------------
      - name: Load payload
        id: payload
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > event.json

          echo "==== RAW EVENT ===="
          cat event.json

          # Support BOTH direct payloads and nested payloads
          if jq -e '.event' event.json >/dev/null 2>&1; then
            EVENT_PATH=".event"
          else
            EVENT_PATH="."
          fi

          TRACE_ID=$(jq -r "${EVENT_PATH}.trace_id // empty" event.json)
          WORKFLOW=$(jq -r "${EVENT_PATH}.workflow // empty" event.json)
          REPO=$(jq -r "${EVENT_PATH}.repo // empty" event.json)
          STATUS=$(jq -r "${EVENT_PATH}.status // \"unknown\"" event.json)
          TIMESTAMP=$(jq -r "${EVENT_PATH}.timestamp // empty" event.json)

          SOURCE=$(jq -r '.source // "unknown"' event.json)
          TARGET=$(jq -r '.target // "none"' event.json)

          echo "trace_id=$TRACE_ID" >> $GITHUB_OUTPUT
          echo "workflow=$WORKFLOW" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      # -----------------------------
      # 3. VALIDATION
      # -----------------------------
      - name: Validate event
        run: |
          if [ -z "${{ steps.payload.outputs.trace_id }}" ] || \
             [ -z "${{ steps.payload.outputs.workflow }}" ] || \
             [ -z "${{ steps.payload.outputs.repo }}" ]; then
            echo "❌ Invalid payload"
            exit 1
          fi

          echo "✅ Payload valid"

      # -----------------------------
      # 4. ROUTE DECISION ENGINE
      # -----------------------------
      - name: Determine route
        id: route
        run: |
          WORKFLOW="${{ steps.payload.outputs.workflow }}"
          STATUS="${{ steps.payload.outputs.status }}"

          TARGET="control-center-result-receiver"

          # FAILURE ROUTING
          if [[ "$STATUS" == *"fail"* ]] || \
             [[ "$STATUS" == *"error"* ]]; then

            TARGET="control-center-recovery"

          # ENGINE EVENTS
          elif [[ "$WORKFLOW" == *"engine"* ]]; then

            TARGET="avot-engine-runner"

          # DISPATCH EVENTS
          elif [[ "$WORKFLOW" == *"dispatch"* ]]; then

            TARGET="cross-repo-dispatcher"

          # CONTROL CENTER EVENTS
          elif [[ "$WORKFLOW" == *"control-center"* ]]; then

            TARGET="control-center-result-receiver"

          fi

          echo "target=$TARGET" >> $GITHUB_OUTPUT

          echo "==== ROUTE DECISION ===="
          echo "Workflow: $WORKFLOW"
          echo "Status: $STATUS"
          echo "Target: $TARGET"

      # -----------------------------
      # 5. SAVE DECISION TRACE
      # -----------------------------
      - name: Save decision
        run: |
          mkdir -p decisions

          jq -n \
            --arg trace_id "${{ steps.payload.outputs.trace_id }}" \
            --arg from "${{ steps.payload.outputs.workflow }}" \
            --arg to "${{ steps.route.outputs.target }}" \
            --arg status "${{ steps.payload.outputs.status }}" \
            --arg timestamp "${{ steps.payload.outputs.timestamp }}" \
            '{
              trace_id: $trace_id,
              from: $from,
              to: $to,
              status: $status,
              decision: "route",
              timestamp: $timestamp
            }' > decisions/${{ steps.payload.outputs.trace_id }}.json

          echo "==== SAVED DECISION ===="
          cat decisions/${{ steps.payload.outputs.trace_id }}.json

      # -----------------------------
      # 6. FORWARD EVENT
      # -----------------------------
      - name: Forward event
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TARGET="${{ steps.route.outputs.target }}"

          echo "➡️ Routing to $TARGET"

          BODY=$(jq -n \
            --arg event_type "$TARGET" \
            --slurpfile payload event.json \
            '{
              event_type: $event_type,
              client_payload: $payload[0]
            }')

          echo "==== DISPATCH BODY ===="
          echo "$BODY"

          RESPONSE=$(curl -s -o response.txt -w "%{http_code}" \
            -X POST https://api.github.com/repos/sovereign-codex/Codex-control-center/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -d "$BODY")

          echo "HTTP Status: $RESPONSE"

          echo "==== RESPONSE ===="
          cat response.txt

          if [ "$RESPONSE" != "204" ]; then
            echo "❌ Dispatch failed"
            exit 1
          fi

          echo "✅ Dispatch succeeded"

      # -----------------------------
      # 7. COMMIT DECISION TRACE
      # -----------------------------
      - name: Commit decision log
        run: |
          git config user.name "codex-bot"
          git config user.email "actions@github.com"

          git add decisions

          git commit -m "Routing decision for ${{ steps.payload.outputs.trace_id }}" || echo "No changes"

          git pull --rebase origin main || true
          git push