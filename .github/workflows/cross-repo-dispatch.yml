name: Cross Repo Dispatcher

on:
  push:
    paths:
      - 'queue/decisions/*.json'

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Control Center
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          owner: sovereign-codex

      - name: Dispatch events to external repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "=== DISPATCHER START ==="

          shopt -s nullglob

          FILES=(queue/decisions/*.json)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No decision files found"
            exit 0
          fi

          for file in "${FILES[@]}"; do
            echo "Processing $file"

            ROUTE=$(jq -r '.routing.route // "unknown"' "$file")
            TRACE=$(jq -r '.trace_id // "no-trace"' "$file")

            echo "Route: $ROUTE"
            echo "Trace: $TRACE"

            TARGET_REPO=""

            if [ "$ROUTE" = "avot-core" ]; then
              TARGET_REPO="sovereign-codex/AVOT-engine-core-"
            elif [ "$ROUTE" = "avot-research" ]; then
              TARGET_REPO="sovereign-codex/AVOT-RESEARCH"
            elif [ "$ROUTE" = "avot-guardian" ]; then
              TARGET_REPO="sovereign-codex/AVOT-GUARDIAN"
            fi

            if [ -z "$TARGET_REPO" ]; then
              echo "No target repo for route: $ROUTE"
              continue
            fi

            echo "Dispatching to $TARGET_REPO"

            curl -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$TARGET_REPO/dispatches \
              -d "{
                \"event_type\": \"avot_execution\",
                \"client_payload\": {
                  \"trace_id\": \"$TRACE\",
                  \"source\": \"control-center\"
                }
              }"

            echo "Dispatch complete for $file"
          done

          echo "=== DISPATCHER END ==="