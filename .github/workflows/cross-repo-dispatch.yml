name: Cross Repo Dispatcher

on:
  repository_dispatch:
    types: [engine_handoff]

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Control Center
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          owner: sovereign-codex

      - name: Emit trace (dispatcher start)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TRACE="dispatcher_${GITHUB_RUN_ID}"

          curl -s -X POST https://api.github.com/repos/sovereign-codex/AVOT-TRACE/dispatches \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{
              \"event_type\": \"trace_log\",
              \"client_payload\": {
                \"trace_id\": \"$TRACE\",
                \"repo\": \"${GITHUB_REPOSITORY}\",
                \"workflow\": \"dispatcher\",
                \"status\": \"started\"
              }
            }"

      - name: Dispatch events to external repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "=== DISPATCHER START ==="

          shopt -s nullglob

          mkdir -p queue/dispatched
          mkdir -p queue/failed

          for file in queue/decisions/*.json; do
            [ -f "$file" ] || continue

            echo "Processing $file"

            ROUTE=$(jq -r '.decision.route // "unknown"' "$file")
            TRACE=$(jq -r '.trace_id // empty' "$file")

            if [ -z "$TRACE" ]; then
              TRACE="dispatcher_${GITHUB_RUN_ID}"
            fi

            echo "Route: $ROUTE"
            echo "Trace: $TRACE"

            TARGET_REPO=""

            case "$ROUTE" in
              "AVOT-engine-core-")
                TARGET_REPO="sovereign-codex/AVOT-engine-core-"
                ;;
              "AVOT-ARCHIVIST")
                TARGET_REPO="sovereign-codex/AVOT-ARCHIVIST"
                ;;
              "Codex-control-center")
                TARGET_REPO="sovereign-codex/Codex-control-center"
                ;;
              "AVOT-TRACE")
                TARGET_REPO="sovereign-codex/AVOT-TRACE"
                ;;
              "Codex-interface-")
                TARGET_REPO="sovereign-codex/Codex-interface-"
                ;;
              "Codex-net-index")
                TARGET_REPO="sovereign-codex/Codex-net-index"
                ;;
            esac

            if [ -n "$TARGET_REPO" ]; then
              echo "Dispatching to $TARGET_REPO"

              RESPONSE=$(curl -s -o response.txt -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/$TARGET_REPO/dispatches \
                -d "{
                  \"event_type\": \"avot_execution\",
                  \"client_payload\": {
                    \"trace_id\": \"$TRACE\",
                    \"source\": \"control-center\",
                    \"route\": \"$ROUTE\"
                  }
                }")

              echo "HTTP Status: $RESPONSE"
              cat response.txt || true

              if [ "$RESPONSE" = "204" ]; then
                echo "Dispatch success"
                STATUS="dispatched"
                mv "$file" queue/dispatched/
              else
                echo "Dispatch failed"
                STATUS="dispatch_failed"
                mv "$file" queue/failed/
              fi

            else
              echo "No target repo for route: $ROUTE"
              STATUS="no_route_found"
              mv "$file" queue/failed/
            fi

            # 🔥 TRACE PER FILE
            curl -s -X POST https://api.github.com/repos/sovereign-codex/AVOT-TRACE/dispatches \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "{
                \"event_type\": \"trace_log\",
                \"client_payload\": {
                  \"trace_id\": \"$TRACE\",
                  \"repo\": \"${GITHUB_REPOSITORY}\",
                  \"workflow\": \"dispatcher\",
                  \"status\": \"$STATUS\"
                }
              }"

          done

          echo "=== DISPATCHER END ==="

      - name: Commit dispatcher queue changes
        run: |
          git config user.name "codex-dispatcher"
          git config user.email "actions@github.com"

          git add queue/dispatched/ queue/failed/
          git commit -m "Dispatcher processed decision queue" || echo "No changes"
          git push