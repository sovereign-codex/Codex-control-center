name: Cross Repo Dispatcher

on:
  push:
    paths:
      - 'queue/decisions/*.json'

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Control Center
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          owner: sovereign-codex

      # 🔥 TRACE: dispatcher start
      - name: Emit trace (dispatcher start)
        run: |
          curl -X POST https://api.github.com/repos/sovereign-codex/AVOT-TRACE/dispatches \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{
              "event_type": "trace_log",
              "client_payload": {
                "trace_id": "${{ github.run_id }}",
                "repo": "${{ github.repository }}",
                "workflow": "Cross Repo Dispatcher",
                "status": "dispatcher_started"
              }
            }'

      - name: Dispatch events to external repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "=== DISPATCHER START ==="

          shopt -s nullglob

          for file in queue/decisions/*.json; do
            [ -f "$file" ] || continue

            echo "Processing $file"

            ROUTE=$(jq -r '.decision.route // "unknown"' "$file")
            TRACE=$(jq -r '.trace_id // empty' "$file")

            # 🔥 fallback to run_id if missing
            if [ -z "$TRACE" ]; then
              TRACE="${GITHUB_RUN_ID}"
            fi

            echo "Route: $ROUTE"
            echo "Trace: $TRACE"

            TARGET_REPO=""

            if [ "$ROUTE" = "AVOT-engine-core-" ]; then
              TARGET_REPO="sovereign-codex/AVOT-engine-core-"
            elif [ "$ROUTE" = "AVOT-ARCHIVIST" ]; then
              TARGET_REPO="sovereign-codex/AVOT-ARCHIVIST"
            elif [ "$ROUTE" = "Codex-control-center" ]; then
              TARGET_REPO="sovereign-codex/Codex-control-center"
            fi

            if [ -n "$TARGET_REPO" ]; then
              echo "Dispatching to $TARGET_REPO"

              RESPONSE=$(curl -s -o response.txt -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/$TARGET_REPO/dispatches \
                -d "{
                  \"event_type\": \"avot_execution\",
                  \"client_payload\": {
                    \"trace_id\": \"$TRACE\",
                    \"source\": \"control-center\"
                  }
                }")

              echo "HTTP Status: $RESPONSE"
              cat response.txt

              if [ "$RESPONSE" = "204" ]; then
                echo "✅ Dispatch success"

                STATUS="dispatched"

                mkdir -p queue/dispatched
                mv "$file" queue/dispatched/
              else
                echo "❌ Dispatch failed"
                STATUS="dispatch_failed"
              fi

              # 🔥 TRACE EMIT PER FILE
              curl -X POST https://api.github.com/repos/sovereign-codex/AVOT-TRACE/dispatches \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -d "{
                  \"event_type\": \"trace_log\",
                  \"client_payload\": {
                    \"trace_id\": \"$TRACE\",
                    \"repo\": \"$GITHUB_REPOSITORY\",
                    \"workflow\": \"dispatcher\",
                    \"status\": \"$STATUS\"
                  }
                }"

            else
              echo "No target repo for route: $ROUTE"

              curl -X POST https://api.github.com/repos/sovereign-codex/AVOT-TRACE/dispatches \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -d "{
                  \"event_type\": \"trace_log\",
                  \"client_payload\": {
                    \"trace_id\": \"$TRACE\",
                    \"repo\": \"$GITHUB_REPOSITORY\",
                    \"workflow\": \"dispatcher\",
                    \"status\": \"no_route_found\"
                  }
                }"
            fi

          done

          echo "=== DISPATCHER END ==="