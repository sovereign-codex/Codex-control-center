name: Control Center Result Receiver

on:
  repository_dispatch:
    types: [routed-event]

permissions:
  contents: write

jobs:
  receive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # 1. VALIDATE + NORMALIZE
      # -------------------------
      - name: Validate Incoming Result
        id: validate
        run: node scripts/validate_trace_event.js
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}

      - name: Reject Invalid Result
        if: steps.validate.outputs.valid != 'true'
        run: |
          echo "Invalid result event rejected"
          echo '${{ steps.validate.outputs.event }}'
          exit 1

      # -------------------------
      # 2. PARSE EVENT
      # -------------------------
      - name: Parse Result
        id: parse
        run: |
          echo '${{ steps.validate.outputs.event }}' > event.json

          TRACE_ID=$(jq -r '.trace_id' event.json)
          STATUS=$(jq -r '.status' event.json)
          RESULT=$(jq -r '.result' event.json)

          echo "trace_id=$TRACE_ID" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "result=$RESULT" >> $GITHUB_OUTPUT

      # -------------------------
      # 3. ENRICH RESULT EVENT
      # -------------------------
      - name: Enrich Result Event
        id: enrich
        run: |
          EVENT='${{ steps.validate.outputs.event }}'

          echo "$EVENT" | jq '
            .status = "result_received" |
            .context.received_by = "control-center-result-receiver" |
            .ontology.phase = "result_processing"
          ' > enriched.json

          echo "event=$(cat enriched.json)" >> $GITHUB_OUTPUT

      # -------------------------
      # 4. STORE TRACE (SOURCE OF TRUTH)
      # -------------------------
      - name: Store Result Trace
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: sovereign-codex/AVOT-TRACE
          event-type: trace-event
          client-payload: ${{ steps.enrich.outputs.event }}

      # -------------------------
      # 5. CLOSE LOOP (CRITICAL)
      # -------------------------
      - name: Emit Completion Event
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: sovereign-codex/Codex-control-center
          event-type: trace-event
          client-payload: >
            {
              "trace_id": "${{ steps.parse.outputs.trace_id }}",
              "status": "execution_completed",
              "result": "${{ steps.parse.outputs.result }}",
              "source": "control-center-result-receiver",
              "workflow": "result_receiver",
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }