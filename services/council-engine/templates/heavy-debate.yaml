name: heavy
version: "0.1.0"

max_roles: 4
requires_conflict_detection: true
default_writeback: issue
requires_memory_update: true

allowed_resolutions:
  - consensus
  - qualified_consensus
  - escalation

role_output_fields:
  - role
  - stance
  - observations
  - risks
  - recommendations
  - confidence
  - priority

required_outputs:
  - summary
  - recommendations
  - writeback
  - memory_updates